<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library - Ink Library</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header>
    <nav aria-label="Main Navigation">
      <a href="../index.html" class="logo">Ink Library</a>

      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="browse.html">Browse</a></li>
        <li><a href="my-library.html">My Library</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="library">

      <h1>My Library</h1>
      <p>Keep track of your collection, wishlist and favourites.</p>

      <div id="library-cards">

        <section class="library-section currently-inked">
          <h2>Currently Inked</h2>
          <p>Your inks currently in rotation.</p>

          <div id="currently-inked-preview" class="ink-preview"></div>

          <a href="currently-inked.html">View all</a>
        </section>


        <section class="library-section favourite">
          <h2>Favourite of the Month</h2>
          <p>None yet</p>

          <a href="favourites.html">View favourites</a>
        </section>

        <section class="library-section owned">
          <h2>Owned</h2>

          <div id="owned-preview" class="ink-preview"></div>

          <a href="owned.html">View all</a>
        </section>

        <section class="library-section wishlist">
          <h2>Wishlist</h2>

          <div id="wishlist-preview" class="ink-preview"></div>

          <a href="wishlist.html">View all</a>
        </section>

      </div>

    </section>

  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
